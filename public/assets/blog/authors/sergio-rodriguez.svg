  </g>
  <g fill="none" stroke="#352136" stroke-width="8" stroke-linecap="square" stroke-linejoin="round">
    <path d="M286 366h-76l-42-42v-70"/>
    <path d="M276 444H138"/>
    <path d="M522 370h88l46-46v-48"/>
    <path d="M526 448h90l40 40v42"/>
  </g>
  <g stroke="#352136" stroke-width="6">
