<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <title>Sergio Rodriguez — el pingüino del laboratorio</title>
  <desc>Emblema de un pingüino electrónico con una terminal como rostro, cuerpo de microcontrolador y conexiones asimétricas. Tinta berenjena, papel cálido, verde menta y naranja.</desc>
