name: Desplegar blog

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:

  # ============================================================
  # GITHUB PAGES
  # ============================================================

  build-pages:
    name: Compilar para GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar para GitHub Pages
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Subir artifact de GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out


  deploy-pages:
    name: Publicar en GitHub Pages
    needs: build-pages
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  # ============================================================
  # CLOUDFLARE
  # ============================================================

  deploy-cloudflare:
    name: Publicar en Cloudflare
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar para Cloudflare
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          
      - name: Desplegar en Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
