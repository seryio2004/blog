name: Desplegar blog

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy-cloudflare:
    name: Publicar en Cloudflare
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build
        env:
          # Token público de Cloudflare Web Analytics (variable del repositorio).
          # Si no existe, el sitio se compila sin analítica.
          NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}

      # Copia del sitemap publicado antes de desplegar, para saber qué URLs cambian.
      - name: Guardar el sitemap publicado
        continue-on-error: true
        run: curl -fsSL --retry 3 https://continuousdisintegration.com/sitemap.xml -o "$RUNNER_TEMP/previous-sitemap.xml"

      - name: Desplegar en Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Avisa a Bing, Yandex, Seznam y Naver de las URLs nuevas, modificadas o eliminadas.
      - name: Avisar a IndexNow
        continue-on-error: true
        run: python3 scripts/indexnow.py --previous "$RUNNER_TEMP/previous-sitemap.xml"
